{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications | Chillventory</title>
  <link rel="stylesheet" href="{% static 'css/notifications.css' %}">
  <style>
    body { font-family: Arial, sans-serif; background: #f9f9f9; }
    .notif-container { max-width: 700px; margin: 40px auto; padding: 20px; background: #fff; border-radius: 10px; box-shadow: 0 0 15px rgba(0,0,0,0.1);}
    h2 { text-align: center; margin-bottom: 20px; }
    .back-btn { padding: 5px 10px; margin-bottom: 20px; cursor: pointer; }
    .notif-list { list-style: none; padding: 0; }
    .notif-item { padding: 10px; border-bottom: 1px solid #eee; }
    .notif-item:last-child { border-bottom: none; }
    .notif-item span { display: block; font-weight: 500; }
    .notif-item small { color: #888; }
    .low { background-color: #fff3e0; }       /* light orange */
    .critical { background-color: #ffe6e6; }  /* light red */
    .expired { background-color: #f0f0f0; color: #d00; } 
    .btn-clear { display: inline-block; margin-bottom: 15px; padding: 6px 12px; background: #f0ad4e; color: #fff; border-radius: 5px; text-decoration: none; }
  </style>
</head>
<body>
  <div class="notif-container">
    <button onclick="window.history.back()" class="back-btn">
      <i class="fa-solid fa-arrow-left"></i> Back
    </button>
    <h2>Notifications</h2>

    <a href="{% url 'clear_all_notifications' %}" class="btn-clear">Clear All</a>

    {% if notifications %}
      <ul class="notif-list">
        {% for notif in notifications %}
          <li class="notif-item
            {% if 'low' in notif.message|lower %}low
            {% elif 'critical' in notif.message|lower %}critical
            {% elif 'expired' in notif.message|lower %}expired
            {% endif %}">
            <span>{{ notif.message }}</span>
            <small>{{ notif.created_at|date:"M d, Y H:i" }}</small>
          </li>
        {% endfor %}
      </ul>
    {% else %}
      <p class="no-notif">No new notifications.</p>
    {% endif %}
  </div>
</body>
</html>
