{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Log History</title>
  <link rel="stylesheet" href="{% static 'dashboard/css/log_history.css' %}">
</head>
<body>
  <header class="header">
  <a href="{% url 'home' %}" class="back-btn">
    <i class="fa-solid fa-arrow-left"></i> Back
  </a>
  <div class="container">
    <h2>Activity Logs</h2>
    <table>
      <thead>
        <tr>
          <th>User</th>
          <th>Action</th>
          <th>Timestamp</th>
        </tr>
      </thead>
      <tbody>
        {% for log in logs %}
        <tr>
          <td>{{ log.user.username }}</td>
          <td>{{ log.action }}</td>
          <td>{{ log.timestamp|date:"Y-m-d H:i" }}</td>
        </tr>
        {% empty %}
        <tr><td colspan="3">No logs yet.</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</body>
</html>
