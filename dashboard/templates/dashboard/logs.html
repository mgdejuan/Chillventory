<h2>Action Logs</h2>
<table>
    <thead>
        <tr>
            <th>User</th>
            <th>Action</th>
            <th>Flavor</th>
            <th>Timestamp</th>
        </tr>
    </thead>
    <tbody>
        {% for log in logs %}
        <tr>
            <td>{{ log.user.username|title }}</td>
            <td>{{ log.get_action_display }}</td>
            <td>{{ log.flavor_name }}</td>
            <td>{{ log.timestamp|date:"M d, Y H:i" }}</td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="4">No logs found.</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
