{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flavors | Sweets N’ Treats</title>

  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- CSS -->
  <link rel="stylesheet" href="{% static 'css/flavors.css' %}">

  <style>
    /* Remove arrows (spinners) from number inputs */
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type=number] {
      -moz-appearance: textfield;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header Section -->
    <header class="header">
      <a href="{% url 'home' %}" class="back-btn">
        <i class="fa-solid fa-arrow-left"></i> Back
      </a>
      <h1><i class="fa-solid fa-ice-cream"></i> Flavors Management</h1>
      <div class="admin-profile">
        <span>{{ request.user.username|title }}</span>
        <i class="fa-solid fa-user"></i>
      </div>
    </header>

    <!-- Add Flavor Form -->
    <section class="add-form">
      <h2>ADD NEW FLAVOR</h2>
      <div class="form-section">
        <input type="text" id="flavorName" placeholder="Flavor Name" required>
        <input type="number" id="price" placeholder="Price" step="0.01" required>
        <input type="number" id="quantity" placeholder="Stock Quantity" min="0" required>
        <input type="date" id="expirationDate" placeholder="Expiration Date" required>
        <button type="button" class="add-btn" id="addFlavorBtn">
          <i class="fa-solid fa-plus"></i> Add Flavor
        </button>
      </div>
    </section>

    <!-- Search & Sort -->
    <div class="search-sort">
      <input type="text" id="searchInput" placeholder="Search by name or price">
      <select id="sortSelect">
        <option value="">Sort by...</option>
        <option value="nameAsc">Name (A–Z)</option>
        <option value="nameDesc">Name (Z–A)</option>
        <option value="priceAsc">Price (Low–High)</option>
        <option value="priceDesc">Price (High–Low)</option>
      </select>
    </div>

    <!-- Flavor List Table -->
    <section class="flavor-list">
      <h2>CURRENT FLAVORS</h2>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Expiration Date</th>
            <th>Flavor Name</th>
            <th>Price</th>
            <th>Stock</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="flavorTableBody"></tbody>
      </table>
    </section>
  </div>

  <!-- JS Logic -->
  <script>
    const addBtn = document.getElementById('addFlavorBtn');
    const flavorNameInput = document.getElementById('flavorName');
    const priceInput = document.getElementById('price');
    const quantityInput = document.getElementById('quantity');
    const expirationInput = document.getElementById('expirationDate');
    const tableBody = document.getElementById('flavorTableBody');
    const searchInput = document.getElementById('searchInput');
    const sortSelect = document.getElementById('sortSelect');

    let flavors = JSON.parse(localStorage.getItem('flavors')) || [];
    let idCounter = flavors.length ? Math.max(...flavors.map(f => f.id)) + 1 : 1;

    function saveToLocalStorage() {
      localStorage.setItem('flavors', JSON.stringify(flavors));
    }

    function renderTable() {
      tableBody.innerHTML = "";
      const searchTerm = searchInput.value.toLowerCase();

      let displayedFlavors = flavors.filter(f =>
        f.name.toLowerCase().includes(searchTerm) ||
        f.price.toLowerCase().includes(searchTerm)
      );

      const sortValue = sortSelect.value;
      if (sortValue === "nameAsc") displayedFlavors.sort((a, b) => a.name.localeCompare(b.name));
      if (sortValue === "nameDesc") displayedFlavors.sort((a, b) => b.name.localeCompare(a.name));
      if (sortValue === "priceAsc") displayedFlavors.sort((a, b) => parseFloat(a.price) - parseFloat(b.price));
      if (sortValue === "priceDesc") displayedFlavors.sort((a, b) => parseFloat(b.price) - parseFloat(a.price));

      displayedFlavors.forEach(flavor => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${flavor.id}</td>
          <td>${flavor.expiration}</td>
          <td>${flavor.name}</td>
          <td>₱${parseFloat(flavor.price).toFixed(2)}</td>
          <td><input type="number" class="quantity-input" value="${flavor.quantity}" min="0"></td>
          <td class="actions">
            <button class="action-btn edit-btn"><i class="fa-solid fa-pen"></i></button>
            <button class="action-btn delete-btn"><i class="fa-solid fa-trash"></i></button>
          </td>
        `;

        row.querySelector('.quantity-input').addEventListener('change', (e) => {
          flavor.quantity = parseInt(e.target.value) || 0;
          saveToLocalStorage();
        });

        row.querySelector('.delete-btn').addEventListener('click', () => {
          if (confirm(`Are you sure you want to delete ${flavor.name}?`)) {
            flavors = flavors.filter(f => f.id !== flavor.id);
            saveToLocalStorage();
            renderTable();
          }
        });

        row.querySelector('.edit-btn').addEventListener('click', () => {
          const newName = prompt("Edit flavor name:", flavor.name);
          const newPrice = prompt("Edit price:", flavor.price);
          const newQuantity = prompt("Edit quantity:", flavor.quantity);
          const newExp = prompt("Edit expiration date (YYYY-MM-DD):", flavor.expiration);

          if (newName && newPrice && newQuantity && newExp) {
            flavor.name = newName.trim();
            flavor.price = newPrice.trim();
            flavor.quantity = parseInt(newQuantity);
            flavor.expiration = newExp.trim();
            saveToLocalStorage();
            renderTable();
          }
        });

        tableBody.appendChild(row);
      });

      if (displayedFlavors.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="6" class="no-data">No flavors found.</td></tr>`;
      }
    }

    function addFlavor() {
      const name = flavorNameInput.value.trim();
      const price = priceInput.value.trim();
      const quantity = parseInt(quantityInput.value) || 0;
      const expiration = expirationInput.value;

      if (!name || !price || !expiration) {
        alert("Please fill out all required fields!");
        return;
      }

      const newFlavor = {
        id: idCounter++,
        name,
        price,
        quantity,
        expiration
      };

      flavors.push(newFlavor);
      saveToLocalStorage();
      renderTable();

      flavorNameInput.value = "";
      priceInput.value = "";
      quantityInput.value = "";
      expirationInput.value = "";
    }

    addBtn.addEventListener('click', addFlavor);
    searchInput.addEventListener('input', renderTable);
    sortSelect.addEventListener('change', renderTable);

    renderTable();
  </script>
</body>
</html>
